
---
- name: Deploy cinematic portfolio frontend
  hosts: frontend
  become: true

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Create frontend directory
      ansible.builtin.file:
        path: /var/www/portfolio
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Copy production frontend
      ansible.builtin.copy:
        src: /home/ubuntu/portfolio-deploy/frontend/dist/
        dest: /var/www/portfolio/
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Configure Nginx for portfolio and API
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/portfolio
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              root /var/www/portfolio;
              index index.html;

              location /api/ {
                  proxy_pass http://172.31.14.22:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
      notify: Restart Nginx

    - name: Enable portfolio Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/portfolio
        dest: /etc/nginx/sites-enabled/portfolio
        state: link
        force: true
      notify: Restart Nginx

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart Nginx

    - name: Ensure Nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted


- name: Deploy cinematic portfolio backend
  hosts: backend
  become: true

  tasks:
    - name: Install Python and virtual environment packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
        state: present
        update_cache: true

    - name: Create backend directory
      ansible.builtin.file:
        path: /opt/portfolio-backend
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy Flask application
      ansible.builtin.copy:
        src: /home/ubuntu/portfolio-deploy/backend/app.py
        dest: /opt/portfolio-backend/app.py
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Copy Python requirements
      ansible.builtin.copy:
        src: /home/ubuntu/portfolio-deploy/backend/requirements.txt
        dest: /opt/portfolio-backend/requirements.txt
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Install backend dependencies in virtual environment
      ansible.builtin.pip:
        requirements: /opt/portfolio-backend/requirements.txt
        virtualenv: /opt/portfolio-backend/venv
        virtualenv_command: python3 -m venv

    - name: Configure backend systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/portfolio-backend.service
        mode: "0644"
        content: |
          [Unit]
          Description=Portfolio Flask API
          After=network.target

          [Service]
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=/opt/portfolio-backend
          ExecStart=/opt/portfolio-backend/venv/bin/gunicorn --workers 2 --bind 0.0.0.0:5000 app:app
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart portfolio backend

    - name: Enable and start backend service
      ansible.builtin.systemd:
        name: portfolio-backend
        daemon_reload: true
        enabled: true
        state: started

  handlers:
    - name: Restart portfolio backend
      ansible.builtin.systemd:
        name: portfolio-backend
        daemon_reload: true
        state: restarted
